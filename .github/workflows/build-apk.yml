name: Build & Sign Lootly APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '0.*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go-miner/go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Android API 35
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Test Go miner and cross-compile libtwitchminer.so
        run: |
          cd go-miner
          go test ./...
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 \
          GOOS=android \
          GOARCH=arm64 \
          go build -trimpath -ldflags="-s -w" -o ../app/src/main/jniLibs/arm64-v8a/libtwitchminer.so ./cmd/twitch-miner-go

      - name: Decode release signing keystore
        env:
          LOOTLY_KEYSTORE_BASE64: ${{ secrets.LOOTLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LOOTLY_KEYSTORE_BASE64" ]; then
            echo "$LOOTLY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lootly-release.jks"
            echo "LOOTLY_KEYSTORE_PATH=$RUNNER_TEMP/lootly-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run Android unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          LOOTLY_KEYSTORE_PASSWORD: ${{ secrets.LOOTLY_KEYSTORE_PASSWORD }}
          LOOTLY_KEY_ALIAS: ${{ secrets.LOOTLY_KEY_ALIAS }}
          LOOTLY_KEY_PASSWORD: ${{ secrets.LOOTLY_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Prepare Lootly.apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found!"
            exit 1
          fi
          cp "$APK_PATH" Lootly.apk
          ls -lh Lootly.apk

      - name: Upload Lootly.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lootly-APK
          path: Lootly.apk
          if-no-files-found: error
